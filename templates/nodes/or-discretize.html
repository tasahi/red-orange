<script type="text/javascript">
    RED.nodes.registerType('or-discretize', {
        category: 'OR Transform',
        color: '#FFD39F',
        defaults: {
            name: { value: "" },
            method: { value: "equal_freq" },
            nBins: { value: 4 }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.png",
        paletteLabel: "Discretize",
        label: function() {
            return this.name || "Discretize";
        },
        oneditprepare: function() {
            const node = this;
            $('<hr>').appendTo('#dialog-form');
            const previewBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget">Preview Output (Data)</button>')
                .appendTo('#dialog-form')
                .on("click", function() {
                    $('#or-preview-container').html("Loading preview...");
                    $.getJSON("redorange/preview/" + node.id + "/Data", function(data) {
                        if (data.error) {
                            $('#or-preview-container').html("<div style='color:red'>" + data.error + "</div>");
                            return;
                        }
                        $('#or-preview-container').html("<pre>" + JSON.stringify(data.rows.slice(0, 10), null, 2) + "</pre>");
                        $('#or-preview-stats').html("<b>" + data.total_rows + "</b> rows × <b>" + data.total_cols + "</b> variables");
                    }).fail(function(jqxhr) {
                        $('#or-preview-container').html("<div style='color:red'>No data yet. Execute the workflow first.</div>");
                    });
                });
            $('<div id="or-preview-container" style="margin-top:10px; width:100%; min-height:50px;"></div>').appendTo('#dialog-form');
            $('<div id="or-preview-stats" style="margin-top:5px; font-size:0.9em; color:#666;"></div>').appendTo('#dialog-form');
        }
    });
</script>

<script type="text/html" data-template-name="or-discretize">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-method"><i class="fa fa-th"></i> Binning</label>
        <select id="node-input-method">
            <option value="equal_freq">Equal Frequency</option>
            <option value="equal_width">Equal Width</option>
            <option value="entropy">Entropy (MDL)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-nBins"><i class="fa fa-hashtag"></i> Bins</label>
        <input type="number" id="node-input-nBins" min="2" max="20" value="4">
    </div>
</script>

<script type="text/html" data-help-name="or-discretize">
    <p>Converts continuous numbers into discrete bins (categories). For example, Age 47 becomes "40–50".</p>
</script>
