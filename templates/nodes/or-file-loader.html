<script type="text/javascript">
    // We only want to load Tabulator once globally in the editor
    if (!window.tabulatorLoaded) {
        window.tabulatorLoaded = true;
        const link = document.createElement("link");
        link.href = "https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css";
        link.rel = "stylesheet";
        document.head.appendChild(link);

        const script = document.createElement("script");
        script.src = "https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js";
        document.head.appendChild(script);
    }

    RED.nodes.registerType('or-file-loader', {
        category: 'OR Data',
        color: '#FFD39F',
        defaults: {
            name: { value: "" },
            filePath: { value: "iris" }
        },
        inputs: 0,
        outputs: 1,
        icon: "file.png",
        paletteLabel: "File Loader",
        label: function() {
            return this.name || "File Loader";
        },
        oneditprepare: function() {
            // Inject a Preview Button at the bottom of the config dialog
            const node = this;
            
            $('<hr>').appendTo('#dialog-form');
            const previewBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget">Preview Output (Data)</button>')
                .appendTo('#dialog-form')
                .on("click", function() {
                    $('#or-preview-container').html("Loading preview...");
                    $.getJSON("redorange/preview/" + node.id + "/Data", function(data) {
                        if (data.error) {
                            $('#or-preview-container').html("<div style='color:red'>" + data.error + "</div>");
                            return;
                        }
                        
                        $('#or-preview-container').html("");
                        
                        // Build Tabulator columns from schema
                        const columns = [];
                        
                        function addCols(specs, roleColor) {
                            specs.forEach(s => {
                                let icon = "C";
                                if (s.var_type === "discrete") icon = "D";
                                if (s.var_type === "string") icon = "S";
                                
                                columns.push({
                                    title: `[${icon}] ${s.name}`,
                                    field: s.name,
                                    headerSort: false,
                                    formatter: function(cell) {
                                        // add role color to cell background
                                        cell.getElement().style.backgroundColor = roleColor;
                                        return cell.getValue();
                                    }
                                });
                            });
                        }
                        
                        addCols(data.schema.attributes, "#ffffff");
                        addCols(data.schema.class_vars, "#e6f2ff"); // Light blue for target
                        addCols(data.schema.metas, "#f9f9f9");      // Light grey for meta
                        
                        new Tabulator("#or-preview-container", {
                            data: data.rows,
                            layout: "fitData",
                            columns: columns,
                            height: "250px"
                        });
                        
                        $('#or-preview-stats').html(`<b>${data.total_rows}</b> rows × <b>${data.total_cols}</b> variables`);
                    }).fail(function(jqxhr) {
                        $('#or-preview-container').html("<div style='color:red'>Failed to fetch preview: " + jqxhr.responseText + "</div>");
                    });
                });
                
            $('<div id="or-preview-container" style="margin-top:10px; width:100%; min-height:50px;"></div>').appendTo('#dialog-form');
            $('<div id="or-preview-stats" style="margin-top:5px; font-size:0.9em; color:#666;"></div>').appendTo('#dialog-form');
        }
    });
</script>

<script type="text/html" data-template-name="or-file-loader">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-filePath"><i class="fa fa-file"></i> File Path</label>
        <input type="text" id="node-input-filePath" placeholder="iris">
    </div>
</script>

<script type="text/html" data-help-name="or-file-loader">
    <p>Loads a dataset from a file (e.g., built-in 'iris', 'titanic', or absolute path).</p>
</script>
