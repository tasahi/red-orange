<script type="text/javascript">
    RED.nodes.registerType('or-box-plot', {
        category: 'OR Visualize',
        color: '#FFB7B1',
        defaults: {
            name: { value: "" },
            yVariable: { value: "" },
            xGroup: { value: "" },
            maxRows: { value: 10000 }
        },
        inputs: 1,
        outputs: 0,
        icon: "font-awesome/fa-eye",

        paletteLabel: "Box Plot",
        label: function() {
            return this.name || "Box Plot";
        },
        oneditprepare: function() {
            if (!window.plotlyLoaded) {
                window.plotlyLoaded = true;
                const script = document.createElement("script");
                script.src = "https://cdn.plot.ly/plotly-2.30.0.min.js";
                document.head.appendChild(script);
            }

            const node = this;
            
            // UI elements
            $('<hr>').appendTo('#dialog-form');
            const previewBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget">Render Box Plot</button>')
                .appendTo('#dialog-form');
            $('<div id="or-boxplot-container" style="width:100%; height:450px; margin-top:10px;"></div>').appendTo('#dialog-form');

            // Populate variable dropdowns
            function updateDropdowns(schema) {
                const ySelect = $('#node-input-yVariable');
                const xSelect = $('#node-input-xGroup');
                const currentY = ySelect.val() || node.yVariable;
                const currentX = xSelect.val() || node.xGroup;

                ySelect.empty().append('<option value="">-- Select Continuous Y --</option>');
                xSelect.empty().append('<option value="">-- No Grouping --</option>');

                if (!schema) return;

                const allVars = [].concat(schema.attributes, schema.class_vars, schema.metas);
                
                allVars.forEach(v => {
                    if (!v) return;
                    if (v.var_type === "continuous") {
                        ySelect.append($('<option>', { value: v.name, text: v.name }));
                    }
                    if (v.var_type === "discrete" || v.var_type === "string") {
                        xSelect.append($('<option>', { value: v.name, text: v.name }));
                    }
                });

                if (currentY) ySelect.val(currentY);
                if (currentX) xSelect.val(currentX);
            }

            // Attempt to get schema right away
            $.getJSON("redorange/preview/" + node.id + "/Data?rows=0", function(data) {
                if (!data.error && data.schema) {
                    updateDropdowns(data.schema);
                }
            }).always(function() {
                if (node.yVariable) {
                    setTimeout(function() { previewBtn.click(); }, 100);
                }
            });

            previewBtn.on("click", function() {
                const yVar = $('#node-input-yVariable').val();
                const xGrp = $('#node-input-xGroup').val();
                const maxRows = $('#node-input-maxRows').val() || 10000;

                if (!yVar) {
                    $('#or-boxplot-container').html("<div style='color:red'>Please select a Continuous Y Variable.</div>");
                    return;
                }

                $('#or-boxplot-container').html("Loading data...");

                $.getJSON("redorange/preview/" + node.id + "/Data?rows=" + maxRows, function(data) {
                    if (data.error) {
                        $('#or-boxplot-container').html("<div style='color:red'>" + data.error + "</div>");
                        return;
                    }

                    if (!data.schema) {
                        updateDropdowns(null);
                        return;
                    }

                    updateDropdowns(data.schema);
                    $('#or-boxplot-container').html("");

                    let traces = [];

                    if (!xGrp) {
                        // Single box plot
                        let yData = data.rows.map(r => r[yVar]).filter(v => v !== null && v !== undefined);
                        traces.push({
                            y: yData,
                            type: 'box',
                            name: yVar,
                            boxpoints: 'Outliers'
                        });
                    } else {
                        // Grouped box plot
                        let groups = {};
                        data.rows.forEach(r => {
                            let g = r[xGrp];
                            let v = r[yVar];
                            if (g === null || g === undefined) g = "Missing";
                            if (v !== null && v !== undefined) {
                                if (!groups[g]) groups[g] = [];
                                groups[g].push(v);
                            }
                        });

                        for (let g in groups) {
                            traces.push({
                                y: groups[g],
                                type: 'box',
                                name: String(g),
                                boxpoints: 'Outliers'
                            });
                        }
                    }

                    let layout = {
                        title: 'Box Plot: ' + yVar + (xGrp ? ' by ' + xGrp : ''),
                        yaxis: { title: yVar },
                        xaxis: { title: xGrp || '' },
                        margin: { t: 40, l: 50, r: 20, b: 50 }
                    };

                    if (traces.length === 0) {
                        $('#or-boxplot-container').html("<div style='color:orange'>No valid numeric data found for " + yVar + ".</div>");
                        return;
                    }

                    Plotly.newPlot('or-boxplot-container', traces, layout);

                }).fail(function(jqxhr) {
                    var msg = "Failed to fetch data";
                    try { msg = JSON.parse(jqxhr.responseText).error || msg; } catch(e) {}
                    $('#or-boxplot-container').html("<div style='color:red'>" + msg + "</div>");
                });
            });
        }
    });
</script>

<script type="text/html" data-template-name="or-box-plot">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-yVariable"><i class="fa fa-arrows-v"></i> Y Variable (Numeric)</label>
        <select id="node-input-yVariable">
            <option value="">-- Deploy node first --</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-xGroup"><i class="fa fa-object-group"></i> Subgroup (Discrete)</label>
        <select id="node-input-xGroup">
            <option value="">-- No Grouping --</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-maxRows"><i class="fa fa-filter"></i> Max Rows to fetch</label>
        <input type="number" id="node-input-maxRows" placeholder="10000" min="1">
    </div>
</script>

<script type="text/html" data-help-name="or-box-plot">
    <p>Visualizes the distribution of continuous variables using Box Plots.</p>
    <p>Displays medians, quartiles, and outliers. Optionally group by a discrete variable.</p>
</script>
