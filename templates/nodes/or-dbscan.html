<script type="text/javascript">
    RED.nodes.registerType('or-dbscan', {
        category: 'OR Unsupervised',
        color: '#CAE1EF',
        defaults: {
            name: { value: "" },
            eps: { value: 0.5 },
            min_samples: { value: 5 },
            metric: { value: "euclidean" }
        },
        inputs: 1,
        outputs: 1,
        outputLabels: ["Annotated Data"],
        icon: "font-awesome/fa-bullseye",
        paletteLabel: "DBSCAN",
        label: function() { return this.name || "DBSCAN"; }
    });
</script>
<script type="text/html" data-template-name="or-dbscan">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-eps"><i class="fa fa-circle-o"></i> Epsilon (eps)</label>
        <input type="number" id="node-input-eps" step="0.01">
    </div>
    <div class="form-row">
        <label for="node-input-min_samples"><i class="fa fa-users"></i> Min Samples</label>
        <input type="number" id="node-input-min_samples" min="1">
    </div>
    <div class="form-row">
        <label for="node-input-metric"><i class="fa fa-arrows-h"></i> Metric</label>
        <select id="node-input-metric">
            <option value="euclidean">Euclidean</option>
            <option value="manhattan">Manhattan</option>
            <option value="cosine">Cosine</option>
        </select>
    </div>
</script>
<script type="text/html" data-help-name="or-dbscan">
    <p>DBSCAN clustering. Returns data with a new 'Cluster' column.</p>
</script>
