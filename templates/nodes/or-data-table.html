<script type="text/javascript">
    RED.nodes.registerType('or-data-table', {
        category: 'OR Data',
        color: '#FFD39F',
        defaults: {
            name: { value: "" }
        },
        inputs: 1,
        outputs: 0,
        icon: "font-awesome/fa-table",
        paletteLabel: "Data Table",
        label: function() {
            return this.name || "Data Table";
        },
        oneditprepare: function() {
            const node = this;
            $('<hr>').appendTo('#dialog-form');
            
            const previewDataBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget">Load Data Table</button>')
                .appendTo('#dialog-form')
                .on("click", function() {
                    $('#or-preview-container').html(`Loading Data...`);
                    // We fetch from Viewer's "Data" output
                    $.getJSON("redorange/preview/" + node.id + "/Data", function(data) {
                        if (data.error) {
                            $('#or-preview-container').html("<div style='color:red'>" + data.error + "</div>");
                            return;
                        }
                        
                        $('#or-preview-container').html("");
                        const columns = [];
                        function addCols(specs, roleColor) {
                            specs.forEach(s => {
                                let icon = "C";
                                if (s.var_type === "discrete") icon = "D";
                                if (s.var_type === "string") icon = "S";
                                columns.push({
                                    title: `[${icon}] ${s.name}`,
                                    field: s.name,
                                    headerSort: true,
                                    formatter: function(cell) {
                                        cell.getElement().style.backgroundColor = roleColor;
                                        return cell.getValue();
                                    }
                                });
                            });
                        }
                        addCols(data.schema.attributes, "#ffffff");
                        addCols(data.schema.class_vars, "#e6f2ff");
                        addCols(data.schema.metas, "#f9f9f9");
                        
                        new Tabulator("#or-preview-container", {
                            data: data.rows,
                            layout: "fitDataStretch",
                            columns: columns,
                            height: "400px",
                            pagination: "local",
                            paginationSize: 20
                        });
                        $('#or-preview-stats').html(`<b>${data.total_rows}</b> rows × <b>${data.total_cols}</b> variables`);
                    }).fail(function(jqxhr) {
                        $('#or-preview-container').html("<div style='color:red'>Failed to fetch: " + jqxhr.responseText + "</div>");
                    });
                });

            $('<div id="or-preview-container" style="margin-top:10px; width:100%; min-height:100px;"></div>').appendTo('#dialog-form');
            $('<div id="or-preview-stats" style="margin-top:5px; font-size:0.9em; color:#666;"></div>').appendTo('#dialog-form');
        }
    });
</script>

<script type="text/html" data-template-name="or-data-table">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="or-data-table">
    <p>Displays the dataset in a tabular format using Tabulator.</p>
</script>
