<script type="text/javascript">
    RED.nodes.registerType('or-tsne', {
        category: 'OR Unsupervised',
        color: '#CAE1EF',
        defaults: {
            name: { value: "" },
            n_components: { value: 2 },
            perplexity: { value: 30 },
            early_exaggeration: { value: 12.0 },
            learning_rate: { value: 200.0 }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["Transformed Data", "Data"],
        icon: "font-awesome/fa-compress",
        paletteLabel: "t-SNE",
        label: function() { return this.name || "t-SNE"; }
    });
</script>
<script type="text/html" data-template-name="or-tsne">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-n_components"><i class="fa fa-arrows-alt"></i> Components</label>
        <input type="number" id="node-input-n_components" min="1" max="3">
    </div>
    <div class="form-row">
        <label for="node-input-perplexity"><i class="fa fa-users"></i> Perplexity</label>
        <input type="number" id="node-input-perplexity" min="1" max="1000">
    </div>
    <div class="form-row">
        <label for="node-input-learning_rate"><i class="fa fa-tachometer"></i> Learning Rate</label>
        <input type="number" id="node-input-learning_rate" min="10" max="1000">
    </div>
</script>
<script type="text/html" data-help-name="or-tsne">
    <p>Dimensionality reduction using t-SNE.</p>
</script>
