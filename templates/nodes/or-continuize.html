<script type="text/javascript">
    RED.nodes.registerType('or-continuize', {
        category: 'OR Transform',
        color: '#FFD39F',
        defaults: {
            name: { value: "" },
            treatment: { value: "one_hot" }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.png",
        paletteLabel: "Continuize",
        label: function() {
            return this.name || "Continuize";
        },
        oneditprepare: function() {
            const node = this;
            $('<hr>').appendTo('#dialog-form');
            const previewBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget">Preview Output (Data)</button>')
                .appendTo('#dialog-form')
                .on("click", function() {
                    $('#or-preview-container').html("Loading preview...");
                    $.getJSON("redorange/preview/" + node.id + "/Data", function(data) {
                        if (data.error) {
                            $('#or-preview-container').html("<div style='color:red'>" + data.error + "</div>");
                            return;
                        }
                        $('#or-preview-container').html("<pre>" + JSON.stringify(data.rows.slice(0, 10), null, 2) + "</pre>");
                        $('#or-preview-stats').html("<b>" + data.total_rows + "</b> rows × <b>" + data.total_cols + "</b> variables");
                    }).fail(function(jqxhr) {
                        $('#or-preview-container').html("<div style='color:red'>No data yet. Execute the workflow first.</div>");
                    });
                });
            $('<div id="or-preview-container" style="margin-top:10px; width:100%; min-height:50px;"></div>').appendTo('#dialog-form');
            $('<div id="or-preview-stats" style="margin-top:5px; font-size:0.9em; color:#666;"></div>').appendTo('#dialog-form');
        }
    });
</script>

<script type="text/html" data-template-name="or-continuize">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-treatment"><i class="fa fa-exchange"></i> Encoding</label>
        <select id="node-input-treatment">
            <option value="one_hot">One-Hot Encoding</option>
            <option value="first_as_base">First as Base (n-1 dummies)</option>
            <option value="as_ordinal">As Ordinal (0, 1, 2, ...)</option>
            <option value="as_normalized_ordinal">Normalized Ordinal (0–1)</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="or-continuize">
    <p>Converts categorical text columns into numbers so ML algorithms can use them. One-Hot creates a separate 0/1 column for each category.</p>
</script>
