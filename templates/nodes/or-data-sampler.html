<script type="text/javascript">
    RED.nodes.registerType('or-data-sampler', {
        category: 'OR Transform',
        color: '#FFD39F',
        defaults: {
            name: { value: "" },
            sampleType: { value: "Proportion" }, // "Proportion" or "Fixed"
            sampleProportion: { value: 70 },
            fixedSampleSize: { value: 100 },
            stratified: { value: false },
            replicable: { value: false },
            seed: { value: 42 }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["Data Sample", "Remaining Data"],
        icon: "font-awesome/fa-random",
        paletteLabel: "Data Sampler",
        label: function() {
            return this.name || "Data Sampler";
        },
        oneditprepare: function() {
            // Show/hide fields based on sample type
            $("#node-input-sampleType").on("change", function() {
                if ($(this).val() === "Proportion") {
                    $("#ror-proportion").show();
                    $("#ror-fixed").hide();
                } else {
                    $("#ror-proportion").hide();
                    $("#ror-fixed").show();
                }
            });

            $("#node-input-replicable").on("change", function() {
                if ($(this).is(":checked")) {
                    $("#ror-seed").show();
                } else {
                    $("#ror-seed").hide();
                }
            });
            
            // Trigger change to set initial visibility
            $("#node-input-sampleType").change();
            $("#node-input-replicable").change();

            // Preview Button
            const node = this;
            $('<hr>').appendTo('#dialog-form');
            
            const previewDataBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget" style="margin-right:5px;">Preview Data</button>')
                .appendTo('#dialog-form')
                .on("click", function() { loadPreview("Data"); });
                
            const previewRemBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget">Preview Remaining</button>')
                .appendTo('#dialog-form')
                .on("click", function() { loadPreview("Remaining Data"); });

            function loadPreview(outputName) {
                $('#or-preview-container').html(`Loading ${outputName}...`);
                $.getJSON("orangered/preview/" + node.id + "/" + outputName, function(data) {
                    if (data.error) {
                        $('#or-preview-container').html("<div style='color:red'>" + data.error + "</div>");
                        return;
                    }
                    
                    $('#or-preview-container').html("");
                    const columns = [];
                    function addCols(specs, roleColor) {
                        specs.forEach(s => {
                            let icon = "C";
                            if (s.var_type === "discrete") icon = "D";
                            if (s.var_type === "string") icon = "S";
                            columns.push({
                                title: `[${icon}] ${s.name}`,
                                field: s.name,
                                headerSort: false,
                                formatter: function(cell) {
                                    cell.getElement().style.backgroundColor = roleColor;
                                    return cell.getValue();
                                }
                            });
                        });
                    }
                    addCols(data.schema.attributes, "#ffffff");
                    addCols(data.schema.class_vars, "#e6f2ff");
                    addCols(data.schema.metas, "#f9f9f9");
                    
                    new Tabulator("#or-preview-container", {
                        data: data.rows,
                        layout: "fitData",
                        columns: columns,
                        height: "250px"
                    });
                    $('#or-preview-stats').html(`<b>${data.total_rows}</b> rows × <b>${data.total_cols}</b> variables`);
                }).fail(function(jqxhr) {
                    $('#or-preview-container').html("<div style='color:red'>Failed to fetch: " + jqxhr.responseText + "</div>");
                });
            }

            $('<div id="or-preview-container" style="margin-top:10px; width:100%; min-height:50px;"></div>').appendTo('#dialog-form');
            $('<div id="or-preview-stats" style="margin-top:5px; font-size:0.9em; color:#666;"></div>').appendTo('#dialog-form');
        }
    });
</script>

<script type="text/html" data-template-name="or-data-sampler">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-sampleType"><i class="fa fa-cog"></i> Type</label>
        <select id="node-input-sampleType">
            <option value="Proportion">Fixed proportion of data</option>
            <option value="Fixed">Fixed sample size</option>
        </select>
    </div>
    <div class="form-row" id="ror-proportion">
        <label for="node-input-sampleProportion"><i class="fa fa-percent"></i> Proportion (%)</label>
        <input type="number" id="node-input-sampleProportion" placeholder="70" min="1" max="100">
    </div>
    <div class="form-row" id="ror-fixed">
        <label for="node-input-fixedSampleSize"><i class="fa fa-hashtag"></i> Sample Size</label>
        <input type="number" id="node-input-fixedSampleSize" placeholder="100" min="1">
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-stratified" style="display:inline-block; width:auto; vertical-align:top;">
        <label for="node-input-stratified" style="width:70%;">Stratified sample</label>
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-replicable" style="display:inline-block; width:auto; vertical-align:top;">
        <label for="node-input-replicable" style="width:70%;">Replicable (deterministic)</label>
    </div>
    <div class="form-row" id="ror-seed">
        <label for="node-input-seed"><i class="fa fa-key"></i> Seed</label>
        <input type="number" id="node-input-seed" placeholder="42">
    </div>
</script>

<script type="text/html" data-help-name="or-data-sampler">
    <p>Randomly selects a subset of data instances from the input dataset.</p>
    <p>Outputs:</p>
    <ul>
        <li><b>Data Sample</b>: The selected instances.</li>
        <li><b>Remaining Data</b>: The unselected instances.</li>
    </ul>
</script>
