<script type="text/javascript">
    RED.nodes.registerType('or-mds', {
        category: 'OR Unsupervised',
        color: '#CAE1EF',
        defaults: {
            name: { value: "" },
            n_components: { value: 2 },
            max_iter: { value: 300 },
            init_type: { value: "PCA" }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["Transformed Data", "Data"],
        icon: "font-awesome/fa-arrows-alt",
        paletteLabel: "MDS",
        label: function() { return this.name || "MDS"; }
    });
</script>
<script type="text/html" data-template-name="or-mds">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-n_components"><i class="fa fa-arrows-alt"></i> Components</label>
        <input type="number" id="node-input-n_components" min="1" max="10">
    </div>
    <div class="form-row">
        <label for="node-input-max_iter"><i class="fa fa-refresh"></i> Max Iter</label>
        <input type="number" id="node-input-max_iter" min="10" max="10000">
    </div>
    <div class="form-row">
        <label for="node-input-init_type"><i class="fa fa-play-circle-o"></i> Init Type</label>
        <select id="node-input-init_type">
            <option value="PCA">PCA</option>
            <option value="Random">Random</option>
        </select>
    </div>
</script>
<script type="text/html" data-help-name="or-mds">
    <p>Dimensionality reduction using Multidimensional Scaling (MDS).</p>
</script>
