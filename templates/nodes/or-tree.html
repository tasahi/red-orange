<script type="text/javascript">
    // Load shared tracker UI (once)
    if (!window.redorangeTrackerLoaded) {
        window.redorangeTrackerLoaded = true;
        $.getScript("redorange/tracker-ui.js");
    }

    RED.nodes.registerType('or-tree', {
        category: 'OR Model',
        color: '#FAC1D9',
        defaults: {
            name: { value: "" },
            maxDepth: { value: "" },
            minSamplesSplit: { value: 2 },
            minSamplesLeaf: { value: 1 }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["Learner", "Model"],
        icon: "font-awesome/fa-sitemap",
        paletteLabel: "Tree",
        label: function() {
            return this.name || "Tree";
        },
        oneditprepare: function() {
            if (window.redorangeTracker) {
                window.redorangeTracker.addHistoryPanel(this);
            }
        }
    });
</script>

<script type="text/html" data-template-name="or-tree">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-maxDepth"><i class="fa fa-level-down"></i> Max Depth</label>
        <input type="number" id="node-input-maxDepth" placeholder="(Unlimited)">
    </div>
    <div class="form-row">
        <label for="node-input-minSamplesSplit"><i class="fa fa-arrows-h"></i> Min Split</label>
        <input type="number" id="node-input-minSamplesSplit" placeholder="2">
    </div>
    <div class="form-row">
        <label for="node-input-minSamplesLeaf"><i class="fa fa-leaf"></i> Min Leaf</label>
        <input type="number" id="node-input-minSamplesLeaf" placeholder="1">
    </div>
</script>

<script type="text/html" data-help-name="or-tree">
    <p>A tree algorithm with forward pruning.</p>
</script>
