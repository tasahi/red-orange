<script type="text/javascript">
    if (!window.redorangeTrackerLoaded) {
        window.redorangeTrackerLoaded = true;
        $.getScript("redorange/tracker-ui.js");
    }
    RED.nodes.registerType('or-adaboost', {
        category: 'OR Model',
        color: '#FAC1D9',
        defaults: {
            name: { value: "" },
            n_estimators: { value: 50 },
            learning_rate: { value: 1.0 }
        },
        inputs: 2,
        outputs: 2,
        outputLabels: ["Learner", "Model"],
        icon: "font-awesome/fa-rocket",
        paletteLabel: "AdaBoost",
        label: function() { return this.name || "AdaBoost"; },
        oneditprepare: function() {
            if (window.redorangeTrackerUI) {
                window.redorangeTrackerUI.injectHistoryTab(this);
            }
        }
    });
</script>
<script type="text/html" data-template-name="or-adaboost">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-n_estimators"><i class="fa fa-tree"></i> Estimators</label>
        <input type="number" id="node-input-n_estimators" min="1">
    </div>
    <div class="form-row">
        <label for="node-input-learning_rate"><i class="fa fa-tachometer"></i> Learning Rate</label>
        <input type="number" id="node-input-learning_rate" step="0.1">
    </div>
</script>
<script type="text/html" data-help-name="or-adaboost">
    <p>AdaBoost Learner.</p>
</script>
