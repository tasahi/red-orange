<script type="text/javascript">
    if (!window.plotlyLoaded) {
        window.plotlyLoaded = true;
        const script = document.createElement("script");
        script.src = "https://cdn.plot.ly/plotly-2.30.0.min.js";
        document.head.appendChild(script);
    }
    if (!window.tabulatorLoaded) {
        window.tabulatorLoaded = true;
        const link = document.createElement("link");
        link.href = "https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css";
        link.rel = "stylesheet";
        document.head.appendChild(link);
        const script = document.createElement("script");
        script.src = "https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js";
        document.head.appendChild(script);
    }

    RED.nodes.registerType('or-test-and-score', {
        category: 'OR Evaluate',
        color: '#C3F3F3',
        defaults: {
            name: { value: "" },
            resampling: { value: "0" }, // 0 = KFold, 1 = ShuffleSplit
            nFolds: { value: 5 },
            nRepeats: { value: 3 },
            sampleSize: { value: 75 },
            stratified: { value: true }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["Predictions", "Evaluation Results"],
        icon: "font-awesome/fa-check-square-o",
        paletteLabel: "Test and Score",
        label: function() {
            return this.name || "Test and Score";
        },
        oneditprepare: function() {
            const node = this;
            $("#node-input-resampling").on("change", function() {
                const val = $(this).val();
                if (val === "0") {
                    $("#ror-folds").show();
                    $("#ror-repeats").hide();
                    $("#ror-sample-size").hide();
                } else if (val === "1") {
                    $("#ror-folds").hide();
                    $("#ror-repeats").show();
                    $("#ror-sample-size").show();
                } else {
                    $("#ror-folds").hide();
                    $("#ror-repeats").hide();
                    $("#ror-sample-size").hide();
                }
            });
            $("#node-input-resampling").change();

            $('<hr>').appendTo('#dialog-form');
            
            const metricsBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget">View Evaluation Metrics</button>')
                .appendTo('#dialog-form')
                .on("click", function() {
                    $('#or-metrics-container').html(`Loading Metrics...`);
                    $.getJSON("redorange/metrics/" + node.id, function(data) {
                        if (data.error) {
                            $('#or-metrics-container').html("<div style='color:red'>" + data.error + "</div>");
                            return;
                        }
                        
                        $('#or-metrics-container').html("");
                        
                        // 1. Render Scores Table
                        $('<div id="or-scores-table" style="margin-bottom:20px;"></div>').appendTo('#or-metrics-container');
                        
                        const rows = [];
                        data.learners.forEach((learner, i) => {
                            const row = { Model: learner };
                            for (const [metric, values] of Object.entries(data.scores)) {
                                row[metric] = values[i];
                            }
                            rows.push(row);
                        });
                        
                        const columns = [{title: "Model", field: "Model"}];
                        for (const metric of Object.keys(data.scores)) {
                            columns.push({title: metric, field: metric, formatter: "money", formatterParams: {symbol: "", precision: 3}});
                        }
                        
                        new Tabulator("#or-scores-table", {
                            data: rows,
                            layout: "fitColumns",
                            columns: columns,
                            height: "150px"
                        });

                        // 2. Render Confusion Matrices if Classification
                        if (data.class_names && data.class_names.length > 0) {
                            const cmContainer = $('<div style="display:flex; flex-wrap:wrap; gap:20px;"></div>').appendTo('#or-metrics-container');
                            
                            for (const [learner, matrix] of Object.entries(data.confusion_matrix)) {
                                const divId = "cm-" + learner.replace(/\s+/g, '-');
                                cmContainer.append(`<div style="width:45%;"><div id="${divId}" style="height:250px;"></div></div>`);
                                
                                // Reverse Y-axis for standard matrix display (True labels top-to-bottom)
                                const zData = [...matrix].reverse();
                                const yLabels = [...data.class_names].reverse();
                                
                                const trace = {
                                    z: zData,
                                    x: data.class_names, // Predicted
                                    y: yLabels,          // Actual
                                    type: 'heatmap',
                                    colorscale: 'Blues',
                                    showscale: false,
                                    text: zData.map(row => row.map(String)),
                                    texttemplate: "%{text}",
                                    hoverinfo: "x+y+z"
                                };
                                
                                Plotly.newPlot(divId, [trace], {
                                    title: learner + ' Confusion Matrix',
                                    xaxis: { title: 'Predicted', side: 'top' },
                                    yaxis: { title: 'Actual' },
                                    margin: { t: 50, l: 80, r: 20, b: 20 }
                                });
                            }
                        }
                        
                    }).fail(function(jqxhr) {
                        $('#or-metrics-container').html("<div style='color:red'>Failed to fetch metrics. Ensure workflow has been executed.</div>");
                    });
                });

            $('<div id="or-metrics-container" style="margin-top:10px; width:100%; min-height:100px;"></div>').appendTo('#dialog-form');
        }
    });
</script>

<script type="text/html" data-template-name="or-test-and-score">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-resampling"><i class="fa fa-refresh"></i> Method</label>
        <select id="node-input-resampling">
            <option value="0">Cross Validation</option>
            <option value="1">Random Sampling</option>
            <option value="2">Leave One Out</option>
            <option value="3">Test on Train Data</option>
            <option value="4">Test on Test Data</option>
        </select>
    </div>
    <div class="form-row" id="ror-folds">
        <label for="node-input-nFolds"><i class="fa fa-navicon"></i> Folds</label>
        <input type="number" id="node-input-nFolds" placeholder="5">
    </div>
    <div class="form-row" id="ror-repeats">
        <label for="node-input-nRepeats"><i class="fa fa-repeat"></i> Repeats</label>
        <input type="number" id="node-input-nRepeats" placeholder="3">
    </div>
    <div class="form-row" id="ror-sample-size">
        <label for="node-input-sampleSize"><i class="fa fa-pie-chart"></i> Train Size (%)</label>
        <input type="number" id="node-input-sampleSize" placeholder="75">
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-stratified" style="display:inline-block; width:auto; vertical-align:top;">
        <label for="node-input-stratified" style="width:70%;">Stratified</label>
    </div>
</script>

<script type="text/html" data-help-name="or-test-and-score">
    <p>Evaluates models using resampling methods (e.g., Cross Validation).</p>
</script>
