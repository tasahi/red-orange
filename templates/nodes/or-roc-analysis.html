<script type="text/javascript">
    if (!window.plotlyLoaded) {
        window.plotlyLoaded = true;
        const script = document.createElement("script");
        script.src = "https://cdn.plot.ly/plotly-2.30.0.min.js";
        document.head.appendChild(script);
    }

    RED.nodes.registerType('or-roc-analysis', {
        category: 'OR Evaluate',
        color: '#C3F3F3',
        defaults: {
            name: { value: "" },
            source_node: { value: "" }
        },
        inputs: 1,
        outputs: 0,
        icon: "font-awesome/fa-area-chart",
        paletteLabel: "ROC Analysis",
        label: function() {
            return this.name || "ROC Analysis";
        },
        oneditprepare: function() {
            const node = this;
            $('<hr>').appendTo('#dialog-form');

            // Populate source_node dropdown with Test & Score nodes
            const sourceSelect = $('#node-input-source_node');
            RED.nodes.eachNode(function(n) {
                if (n.type === "or-test-and-score") {
                    sourceSelect.append($('<option>', {
                        value: n.id,
                        text: n.name || "Test and Score (" + n.id.substring(0, 6) + ")"
                    }));
                }
            });
            if (node.source_node) {
                sourceSelect.val(node.source_node);
            }

            const renderBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget">Render ROC Curves</button>')
                .appendTo('#dialog-form');

            $('<div id="or-roc-container" style="width:100%; height:450px; margin-top:10px;"></div>').appendTo('#dialog-form');

            if (node.source_node) {
                setTimeout(function() { renderBtn.click(); }, 100);
            }

            renderBtn.on("click", function() {
                const srcId = $('#node-input-source_node').val();
                if (!srcId) {
                    $('#or-roc-container').html("<div style='color:red'>Please select a Test & Score node.</div>");
                    return;
                }
                $('#or-roc-container').html("Loading ROC data...");

                $.getJSON("orangered/roc/" + srcId, function(data) {
                    if (data.error) {
                        $('#or-roc-container').html("<div style='color:red'>" + data.error + "</div>");
                        return;
                    }

                    $('#or-roc-container').html("");

                    var traces = [];

                    // Color palette
                    var colors = [
                        '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728',
                        '#9467bd', '#8c564b', '#e377c2', '#7f7f7f'
                    ];
                    var colorIdx = 0;

                    for (var learner of data.learners) {
                        var curves = data.roc_curves[learner];
                        if (!curves) continue;

                        // For multi-class, we average across all classes (macro-average)
                        // Also plot individual class curves with lower opacity
                        if (curves.length > 1) {
                            // Plot per-class curves (semi-transparent)
                            for (var c = 0; c < curves.length; c++) {
                                traces.push({
                                    x: curves[c].fpr,
                                    y: curves[c].tpr,
                                    mode: 'lines',
                                    name: learner + ' (' + curves[c].class_name + ')',
                                    line: { color: colors[colorIdx % colors.length], width: 1, dash: 'dot' },
                                    opacity: 0.5,
                                    showlegend: false
                                });
                            }

                            // Compute macro-average ROC
                            var avgFpr = curves[0].fpr.map(function(_, i) {
                                var sum = 0;
                                curves.forEach(function(curve) {
                                    sum += (curve.fpr[i] || 0);
                                });
                                return sum / curves.length;
                            });
                            var avgTpr = curves[0].tpr.map(function(_, i) {
                                var sum = 0;
                                curves.forEach(function(curve) {
                                    sum += (curve.tpr[i] || 0);
                                });
                                return sum / curves.length;
                            });

                            traces.push({
                                x: avgFpr,
                                y: avgTpr,
                                mode: 'lines',
                                name: learner + ' (macro avg)',
                                line: { color: colors[colorIdx % colors.length], width: 2.5 }
                            });
                        } else {
                            // Binary classification — single curve
                            traces.push({
                                x: curves[0].fpr,
                                y: curves[0].tpr,
                                mode: 'lines',
                                name: learner,
                                line: { color: colors[colorIdx % colors.length], width: 2.5 }
                            });
                        }

                        colorIdx++;
                    }

                    // Diagonal reference line
                    traces.push({
                        x: [0, 1],
                        y: [0, 1],
                        mode: 'lines',
                        name: 'Random',
                        line: { color: '#999', width: 1, dash: 'dash' },
                        showlegend: false
                    });

                    Plotly.newPlot('or-roc-container', traces, {
                        title: 'ROC Analysis',
                        xaxis: { title: 'False Positive Rate', range: [0, 1] },
                        yaxis: { title: 'True Positive Rate', range: [0, 1.05] },
                        legend: { x: 0.5, y: -0.15, orientation: 'h' },
                        margin: { t: 50, l: 60, r: 20, b: 80 }
                    });

                }).fail(function(jqxhr) {
                    var msg = "Failed to fetch ROC data";
                    try { msg = JSON.parse(jqxhr.responseText).error || msg; } catch(e) {}
                    $('#or-roc-container').html("<div style='color:red'>" + msg + "</div>");
                });
            });
        }
    });
</script>

<script type="text/html" data-template-name="or-roc-analysis">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-source_node"><i class="fa fa-area-chart"></i> Source Node</label>
        <select id="node-input-source_node">
            <option value="">-- Select Test & Score --</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="or-roc-analysis">
    <p>Displays ROC (Receiver Operating Characteristic) curves for each learner evaluated
    by a <b>Test & Score</b> node.</p>
    <p>Select the Test & Score node from the dropdown, deploy, and click <b>Render ROC Curves</b>.</p>
</script>
