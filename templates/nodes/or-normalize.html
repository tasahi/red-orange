<script type="text/javascript">
    RED.nodes.registerType('or-normalize', {
        category: 'OR Transform',
        color: '#FFD39F',
        defaults: {
            name: { value: "" },
            method: { value: "standardize" }
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.png",
        paletteLabel: "Normalize",
        label: function() {
            return this.name || "Normalize";
        },
        oneditprepare: function() {
            const node = this;
            $('<hr>').appendTo('#dialog-form');
            const previewBtn = $('<button type="button" class="ui-button ui-corner-all ui-widget">Preview Output (Data)</button>')
                .appendTo('#dialog-form')
                .on("click", function() {
                    $('#or-preview-container').html("Loading preview...");
                    $.getJSON("orangered/preview/" + node.id + "/Data", function(data) {
                        if (data.error) {
                            $('#or-preview-container').html("<div style='color:red'>" + data.error + "</div>");
                            return;
                        }
                        $('#or-preview-container').html("<pre>" + JSON.stringify(data.rows.slice(0, 10), null, 2) + "</pre>");
                        $('#or-preview-stats').html("<b>" + data.total_rows + "</b> rows × <b>" + data.total_cols + "</b> variables");
                    }).fail(function(jqxhr) {
                        $('#or-preview-container').html("<div style='color:red'>No data yet. Execute the workflow first.</div>");
                    });
                });
            $('<div id="or-preview-container" style="margin-top:10px; width:100%; min-height:50px;"></div>').appendTo('#dialog-form');
            $('<div id="or-preview-stats" style="margin-top:5px; font-size:0.9em; color:#666;"></div>').appendTo('#dialog-form');
        }
    });
</script>

<script type="text/html" data-template-name="or-normalize">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-method"><i class="fa fa-balance-scale"></i> Method</label>
        <select id="node-input-method">
            <option value="standardize">Standardize (mean=0, std=1)</option>
            <option value="minmax">Min-Max (scale to 0–1)</option>
            <option value="center">Center (subtract mean)</option>
            <option value="scale">Scale (divide by std)</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="or-normalize">
    <p>Rescales numeric features so they are comparable. Use "Standardize" for most ML algorithms.</p>
</script>
